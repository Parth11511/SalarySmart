<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SalarySmart</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }
    header {
      background: #173b6c;
      color: white;
      text-align: center;
      padding: 24px 12px;
    }
    .container {
      max-width: 420px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }
    h2 { color: #173b6c; text-align: center; }
    label { display: block; margin-top: 15px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: 0;
      border-radius: 6px;
      background: #173b6c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    p { line-height: 1.5; }
    a { color: #173b6c; }
    #message { overflow-wrap: anywhere; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>SalarySmart</h1>
    <p>Your salary, your budget, your future.</p>
  </header>

  <main class="container">
    <h2>Login to Your Account</h2>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             required placeholder="Enter your email">

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password"
             required placeholder="Enter your password">

      <button id="login-button" type="submit">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="center">
      Don't have an account?
      <a href="signup.html">Create an account</a>
    </p>
    <p class="center"><a href="index.html">Back to Home</a></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKGWC3fTfDoC-RhMC0tGUNDkx98u0SRsU",
      authDomain: "salarysmart.firebaseapp.com",
      projectId: "salarysmart",
      storageBucket: "salarysmart.firebasestorage.app",
      messagingSenderId: "730494116667",
      appId: "1:730494116667:web:ede99121995f920a910d1e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const button = document.getElementById("login-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        message.textContent = "Login successful! Opening SalarySmart...";
        window.location.href = "index.html";
      } catch (error) {
        message.textContent =
          error.code === "auth/invalid-credential"
            ? "Email or password is incorrect."
            : error.code === "auth/too-many-requests"
            ? "Too many attempts. Please try again later."
            : "Login failed. Check your details and Firebase settings.";
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>
</body>
</html>
